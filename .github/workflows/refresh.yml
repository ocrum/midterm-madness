name: Refresh odds
# Manual only for now. To run daily, uncomment the schedule (it runs from the default branch).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 12 * * *'   # 12:17 UTC daily
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./refresh.sh
      - run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add site/index.html data/latest.json data/props.json
          git commit -m "Refresh odds $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
